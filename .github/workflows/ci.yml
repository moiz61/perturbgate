name: PerturbGate CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Train and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Train model
        run: |
          python train.py

      - name: Verify model artifact exists
        run: |
          test -s artifacts/model.joblib
          ls -lh artifacts/model.joblib

      - name: Compile Python source
        run: |
          python -m compileall -q app train.py

      - name: Run test suite
        run: |
          pytest -q

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Train model for image
        run: |
          python train.py

      - name: Build Docker image
        run: |
          docker build -t perturbgate:ci .
